<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bastionfall F1.04 — renderer benchmark (NOT GAMEPLAY)</title>
  <style>
    body { margin: 0; background: #e9ebe3; color: #243338; font: 15px system-ui; }
    main { max-width: 820px; margin: 10px auto; }
    canvas { display: block; width: 800px; height: 600px; }
  </style>
</head>
<body data-result="pending">
<main>
  <h1>F1.04 WebGL2 instancing benchmark — ENGINEERING ONLY</h1>
  <p>500 identical authored test primitives. Not Bastionfall game art or a playable scene.</p>
  <canvas width="800" height="600" id="benchmark" aria-label="Engine instancing benchmark"></canvas>
  <pre id="trace">Starting renderer...</pre>
</main>
<script type="module">
  import { mat4 } from "/node_modules/.vite/deps/gl-matrix.js";
  import { OrthoCamera } from "/src/engine/Camera.ts";
  import { bevelBox } from "/src/art/mesh/Primitives.ts";
  import { InstancedRenderer } from "/src/engine/render/InstancedRenderer.ts";

  const body = document.body;
  let renderer;
  try {
    const canvas = document.querySelector("#benchmark");
    const gl = canvas.getContext("webgl2", {antialias: false, preserveDrawingBuffer: true});
    if (!gl) throw new Error("WebGL2 could not be obtained");
    renderer = new InstancedRenderer(gl);
    renderer.uploadMesh("test-box", bevelBox(0.9, 1.0, 0.9, 0.08));
    const camera = new OrthoCamera(canvas.width, canvas.height);
    const instances = [];
    for (let i = 0; i < 500; i++) {
      const x = ((i % 25) - 12) * 1.25;
      const z = (Math.floor(i / 25) - 9.5) * 1.25;
      const model = mat4.fromTranslation(mat4.create(), [x, 0.5, z]);
      instances.push({meshId:"test-box", material:"stone.base", model});
    }
    const trace = [];
    for (let frame = 0; frame < 12; frame++) {
      trace.push(renderer.render(camera.matrices, instances));
    }
    const error = gl.getError();
    if (error !== gl.NO_ERROR) throw new Error("WebGL error " + error);
    const first = trace[0];
    const last = trace.at(-1);
    if (!first || !last || first.drawCalls !== 1 || last.drawCalls !== 1
        || last.instances !== 500 || renderer.meshCount !== 1
        || last.instanceCapacity < 500
        || trace.some(row => row.triangles !== first.triangles)) {
      throw new Error("Expected 500 instances in 1 draw call with reused GPU mesh");
    }
    const pixels = new Uint8Array(canvas.width * canvas.height * 4);
    gl.readPixels(0, 0, canvas.width, canvas.height, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
    let changed = 0;
    for (let i = 0; i < pixels.length; i += 16) {
      if (Math.abs(pixels[i] - 212) > 18
          || Math.abs(pixels[i+1] - 219) > 18
          || Math.abs(pixels[i+2] - 210) > 18) changed++;
    }
    if (changed < 100) throw new Error("Frame buffer appears empty or unchanged: " + changed);
    const cpuSamples = trace.slice(2).map(row => row.cpuMilliseconds).sort((a,b)=>a-b);
    const p95 = cpuSamples[Math.ceil(cpuSamples.length * 0.95) - 1];
    const summary = {
      type: "CPU-submission-only, no GPU timing", frames: trace.length,
      instances: last.instances, draws: last.drawCalls,
      triangles: last.triangles, framebufferChangedSamples: changed,
      cpuP95ms: Number(p95.toFixed(3)), capacity: last.instanceCapacity,
      meshCount: renderer.meshCount,
    };
    body.dataset.result = "pass";
    body.dataset.draws = String(last.drawCalls);
    body.dataset.instances = String(last.instances);
    body.dataset.changed = String(changed);
    body.dataset.cpuP95Ms = String(summary.cpuP95ms);
    document.querySelector("#trace").textContent = JSON.stringify(summary);
    console.info("F1.04_BENCHMARK", JSON.stringify(summary));
  } catch (error) {
    body.dataset.result = "fail";
    document.querySelector("#trace").textContent =
      String(error instanceof Error ? error.stack : error);
  } finally {
    renderer?.dispose();
  }
</script>
</body>
</html>
