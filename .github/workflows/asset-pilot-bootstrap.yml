name: One-time CC0 Asset + Locked Three.js Pilot Bootstrap

# This narrow trusted branch can write generated, validated binary assets and
# npm lock changes. It NEVER runs for untrusted pull_request code or on main.
on:
  push:
    branches: ["feat/asset-first-threejs-pilot"]

permissions:
  contents: write

jobs:
  build-and-commit-vetted-lantern:
    if: "!contains(github.event.head_commit.message, '[asset bootstrap]')"
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned Three.js runtime and types; regenerate exact lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --save-exact three@0.184.0
          npm install --no-audit --no-fund --save-dev --save-exact @types/three@0.184.0
          npm ci --no-audit --no-fund
      - name: Prepare isolated pinned image tool
        shell: bash
        run: |
          python3 -m venv /tmp/bastionfall-asset-tools
          /tmp/bastionfall-asset-tools/bin/pip install --disable-pip-version-check pillow==11.3.0
      - name: Fetch pinned official CC0 wooden lantern and rebuild embedded textures
        shell: bash
        run: |
          set -euo pipefail
          /tmp/bastionfall-asset-tools/bin/python scripts/ingest_lantern.py
          file public/assets/lantern-cc0.glb
          (cd public/assets && sha256sum -c lantern-cc0.sha256)
      - name: Strict TS, Vitest including real bundled GLB integrity, production Vite
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
          npm run build
      - name: Real Chrome WebGL2 proof inside existing Warden scene, both aspect ratios
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 4173 --strictPort >/tmp/bastionfall-three-vite.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.3
          done
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          for aspect in landscape portrait; do
            if [[ "$aspect" = portrait ]]; then
              url='http://127.0.0.1:4173/tests/terrain-preview.html?view=movement&aspect=portrait&assetPilot=1'
              size='900,1200'
            else
              url='http://127.0.0.1:4173/tests/terrain-preview.html?view=movement&assetPilot=1'
              size='1500,950'
            fi
            "$browser" --headless=new --no-sandbox --disable-dev-shm-usage \
              --use-angle=swiftshader --enable-unsafe-swiftshader --enable-webgl \
              --window-size="$size" --virtual-time-budget=13000 \
              --dump-dom "$url" >"/tmp/imported-$aspect.html" 2>"/tmp/imported-$aspect.log"
            if ! grep -q 'data-result="pass"' "/tmp/imported-$aspect.html" \
              || ! grep -q 'data-asset-pilot="pass"' "/tmp/imported-$aspect.html" \
              || ! grep -Eq 'data-asset-textured="[1-9][0-9]*"' "/tmp/imported-$aspect.html" \
              || ! grep -q 'data-hero-visible="true"' "/tmp/imported-$aspect.html"; then
              echo "FAIL: genuine Three.js textured GLB not rendered in $aspect game"
              tail -c 8000 "/tmp/imported-$aspect.html"
              tail -c 5000 "/tmp/imported-$aspect.log"
              exit 1
            fi
            "$browser" --headless=new --no-sandbox --disable-dev-shm-usage \
              --use-angle=swiftshader --enable-unsafe-swiftshader --enable-webgl \
              --window-size="$size" --virtual-time-budget=13000 \
              --screenshot="/tmp/imported-$aspect.png" "$url" \
              >/tmp/imported-"$aspect"-capture.log 2>&1
            test -s "/tmp/imported-$aspect.png"
            echo "PASS: $aspect game world with source-verified PBR GLB and unchanged Warden"
          done
      - name: Commit verified dependency lock and bundled optimized CC0 binary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json public/assets/lantern-cc0.glb public/assets/lantern-cc0.sha256
          if git diff --cached --quiet; then
            echo "Generated asset/dependencies already match; no update needed"
          else
            git commit -m "build: pin Three.js and bundle checksum-verified CC0 lantern [asset bootstrap]"
            git push origin HEAD:feat/asset-first-threejs-pilot
          fi
      - name: Save real browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: art01-three-textured-glb-game-screenshots
          path: |
            /tmp/imported-landscape.png
            /tmp/imported-portrait.png
            /tmp/imported-landscape.html
            /tmp/imported-portrait.html
          if-no-files-found: warn
          retention-days: 21
