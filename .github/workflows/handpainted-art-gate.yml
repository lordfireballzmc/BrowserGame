name: ART.LOCK — original hand-painted asset integrity

# Work-in-progress art migrations must state they are PARTIAL in their PR
# description and may pass with an explicit original-PNG-archive warning.
# Final art acceptance ALWAYS uses SHA-256 strict and cannot pass if references
# are absent or substituted. This prevents permanent paralysis of the existing
# visually rejected game while preserving the user's non-negotiable final art gate.
on:
  pull_request:
    paths:
      - "src/art/**"
      - "src/engine/render/**"
      - "public/assets/**"
      - "src/ui/**"
      - "tests/terrain-preview.html"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-art-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require explicit PARTIAL classification or full binary-original compliance
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${PR_BODY:-}" == *"PARTIAL, not final art acceptance"* ]]; then
            echo "::warning title=ART.LOCK not visually accepted::This PR is an explicitly PARTIAL art migration. The approved original PNG reference archive remains mandatory before final asset approval. No user/AAA compliance is claimed."
            node scripts/verify-art-anchor.mjs
          else
            node scripts/verify-art-anchor.mjs --strict
          fi
