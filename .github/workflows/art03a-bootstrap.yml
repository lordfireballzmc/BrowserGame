name: ART03a CC0 source-pinned KayKit rigged character ingest

# Temporary trusted-branch-only one-time pack generation.
# Removed immediately after asset/manifest/checksums are committed.
on:
  push:
    branches: ["feat/art03a-rigged-cartoon-characters"]
permissions:
  contents: write
concurrency:
  group: art03a-ingest
  cancel-in-progress: true
jobs:
  ingest:
    if: "!contains(github.event.head_commit.message, '[kaykit assets built]')"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download source-pinned, verified CC0 models, repack skeletal animations and textures
        run: |
          set -euo pipefail
          python3 scripts/ingest_kaykit_characters.py
          du -h public/assets/characters/*
          (cd public/assets/characters && for x in *.sha256; do sha256sum -c "$x"; done)
      - name: Commit only 3 verified reduced GLB binaries, SHAs and manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/characters/*.glb public/assets/characters/*.sha256 public/assets/characters/manifest.json
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "build: embed 3 exact CC0 KayKit skeletal GLBs [kaykit assets built]"
            git push origin HEAD:feat/art03a-rigged-cartoon-characters
          fi
