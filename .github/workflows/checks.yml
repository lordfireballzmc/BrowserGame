name: Build and Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 22 with npm dependency cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Browser smoke - WebGL2 disabled recovery screen
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 4173 --strictPort >/tmp/bastionfall-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          available=0
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ -o /tmp/bastionfall-index.html 2>/dev/null; then
              available=1
              break
            fi
            sleep 0.25
          done
          if [ "$available" -ne 1 ]; then
            cat /tmp/bastionfall-vite.log
            exit 1
          fi
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$browser" --headless=new --no-sandbox --disable-dev-shm-usage --disable-webgl \
            --virtual-time-budget=3000 --dump-dom http://127.0.0.1:4173/ \
            >/tmp/bastionfall-rendered.html 2>/tmp/bastionfall-browser.log
          if ! grep -q 'data-graphics="unavailable"' /tmp/bastionfall-rendered.html; then
            echo "Expected explicit WebGL2 failure state in executed HTML"
            tail -c 3500 /tmp/bastionfall-rendered.html
            exit 1
          fi
          echo "PASS: app loaded and rendered an explicit WebGL2-unavailable fallback"
          # Exercise the positive, *real* WebGL2 shader/link/upload path under
          # Chrome's software renderer (no dedicated GPU required).
          "$browser" --headless=new --no-sandbox --disable-dev-shm-usage \
            --use-angle=swiftshader --enable-unsafe-swiftshader --enable-webgl \
            --virtual-time-budget=4000 --dump-dom http://127.0.0.1:4173/ \
            >/tmp/bastionfall-webgl-ready.html 2>/tmp/bastionfall-webgl-ready.log
          if ! grep -q 'GPU resources checked' /tmp/bastionfall-webgl-ready.html; then
            echo "WebGL2 shader/link/buffer smoke did not reach ready state."
            tail -c 4000 /tmp/bastionfall-webgl-ready.html
            tail -c 1500 /tmp/bastionfall-webgl-ready.log
            exit 1
          fi
          echo "PASS: real software WebGL2 shader link, buffer upload and VAO cleanup"
          # Real instancing acceptance gate (engineering-only page, not gameplay).
          "$browser" --headless=new --no-sandbox --disable-dev-shm-usage \
            --use-angle=swiftshader --enable-unsafe-swiftshader --enable-webgl \
            --virtual-time-budget=7000 --dump-dom http://127.0.0.1:4173/tests/renderer-benchmark.html \
            >/tmp/bastionfall-instancing.html 2>/tmp/bastionfall-instancing.log
          if ! grep -q 'data-result="pass"' /tmp/bastionfall-instancing.html \
            || ! grep -q 'data-draws="1"' /tmp/bastionfall-instancing.html \
            || ! grep -q 'data-instances="500"' /tmp/bastionfall-instancing.html; then
            echo "F1.04 500-instance WebGL2 smoke failed"
            tail -c 5000 /tmp/bastionfall-instancing.html
            tail -c 1500 /tmp/bastionfall-instancing.log
            exit 1
          fi
          grep -o '<pre id="trace">[^<]*' /tmp/bastionfall-instancing.html | head -1
          echo "PASS: WebGL2 rendered 500 instances with one draw call and nonempty framebuffer"
          # F1.05 main-app integration: actually render the diagnostic in both
          # portrait and landscape, not merely calculate dimensions in Vitest.
          for orientation in portrait landscape; do
            if [ "$orientation" = portrait ]; then dimensions="420,1000"; else dimensions="1200,720"; fi
            "$browser" --headless=new --no-sandbox --disable-dev-shm-usage \
              --use-angle=swiftshader --enable-unsafe-swiftshader --enable-webgl \
              --window-size="$dimensions" --virtual-time-budget=5000 \
              --dump-dom 'http://127.0.0.1:4173/?diagnostic=1' \
              >"/tmp/bastionfall-$orientation.html" 2>"/tmp/bastionfall-$orientation.log"
            if ! grep -q 'data-render-state="active"' "/tmp/bastionfall-$orientation.html" \
              || ! grep -q "data-orientation=\"$orientation\"" "/tmp/bastionfall-$orientation.html" \
              || ! grep -q 'Draws 6' "/tmp/bastionfall-$orientation.html" \
              || ! grep -q 'GPU [0-9]' "/tmp/bastionfall-$orientation.html"; then
              echo "F1.05 main-app $orientation canvas diagnostic failed"
              tail -c 4500 "/tmp/bastionfall-$orientation.html"
              tail -c 1500 "/tmp/bastionfall-$orientation.log"
              exit 1
            fi
            echo "PASS: $orientation responsive canvas and true instanced-renderer metrics"
          done
          # Exercise actual diagnostic exception UI, not just shader startup.
          "$browser" --headless=new --no-sandbox --disable-dev-shm-usage \
            --use-angle=swiftshader --enable-unsafe-swiftshader --enable-webgl \
            --window-size=1200,720 --virtual-time-budget=4500 \
            --dump-dom 'http://127.0.0.1:4173/?diagnostic=1&failRender=1' \
            >/tmp/bastionfall-diagnostic-error.html 2>/tmp/bastionfall-diagnostic-error.log
          if ! grep -q 'data-render-state="error"' /tmp/bastionfall-diagnostic-error.html \
            || ! grep -q 'Simulated diagnostic render failure' /tmp/bastionfall-diagnostic-error.html \
            || ! grep -q 'id="retry-renderer"' /tmp/bastionfall-diagnostic-error.html; then
            echo "F1.05 explicit render error overlay failed"
            tail -c 4500 /tmp/bastionfall-diagnostic-error.html
            exit 1
          fi
          echo "PASS: renderer exception shows the retryable error overlay"
          # Art-authorship gate: the actual application must load each of the
          # four authored meshes and draw the gallery on real software WebGL2.
          "$browser" --headless=new --no-sandbox --disable-dev-shm-usage \
            --use-angle=swiftshader --enable-unsafe-swiftshader --enable-webgl \
            --window-size=1200,900 --virtual-time-budget=5500 \
            --dump-dom 'http://127.0.0.1:4173/?diagnostic=1' \
            >/tmp/bastionfall-art-gallery.html 2>/tmp/bastionfall-art-gallery.log
          if ! grep -q 'data-render-state="active"' /tmp/bastionfall-art-gallery.html \
            || ! grep -q 'Draws 6' /tmp/bastionfall-art-gallery.html \
            || ! grep -q 'WARDEN' /tmp/bastionfall-art-gallery.html \
            || ! grep -q 'SHIELDBEARER' /tmp/bastionfall-art-gallery.html \
            || ! grep -q 'FRONTIER KEEP' /tmp/bastionfall-art-gallery.html; then
            echo "F1.06 authored mesh rendering failed"
            tail -c 6500 /tmp/bastionfall-art-gallery.html
            tail -c 2500 /tmp/bastionfall-art-gallery.log
            exit 1
          fi
          "$browser" --headless=new --no-sandbox --disable-dev-shm-usage \
            --use-angle=swiftshader --enable-unsafe-swiftshader --enable-webgl \
            --window-size=1200,900 --virtual-time-budget=5500 \
            --screenshot=/tmp/bastionfall-gallery-landscape.png \
            'http://127.0.0.1:4173/?diagnostic=1' \
            >/tmp/bastionfall-gallery-capture.log 2>&1
          test -s /tmp/bastionfall-gallery-landscape.png
          echo "PASS: F1.06 authored geometry rendered; real Chrome screenshot captured"
          # F2.01: render the terrain meshes in a standalone engineering scene
          # and check that the actual WebGL framebuffer is nonempty.
          "$browser" --headless=new --no-sandbox --disable-dev-shm-usage \
            --use-angle=swiftshader --enable-unsafe-swiftshader --enable-webgl \
            --window-size=1280,960 --virtual-time-budget=6500 \
            --dump-dom 'http://127.0.0.1:4173/tests/terrain-preview.html' \
            >/tmp/bastionfall-island.html 2>/tmp/bastionfall-island.log
          if ! grep -q 'data-result="pass"' /tmp/bastionfall-island.html \
            || ! grep -q 'data-tiles="54"' /tmp/bastionfall-island.html \
            || ! grep -q 'data-road="pass"' /tmp/bastionfall-island.html \
            || ! grep -q '"roadWidthMeters":4.5' /tmp/bastionfall-island.html \
            || ! grep -q 'data-pad-count="10"' /tmp/bastionfall-island.html \
            || ! grep -q 'data-pad-price="20 crowns"' /tmp/bastionfall-island.html \
            || ! grep -q 'data-pad-id="P01"' /tmp/bastionfall-island.html \
            || ! grep -q 'data-river="pass"' /tmp/bastionfall-island.html \
            || ! grep -q 'data-bridges="2"' /tmp/bastionfall-island.html \
            || ! grep -q '"riverSegments":66' /tmp/bastionfall-island.html \
            || ! grep -q 'data-scenery="pass"' /tmp/bastionfall-island.html \
            || ! grep -q 'data-scenery-count="258"' /tmp/bastionfall-island.html \
            || ! grep -q '"sceneryDraws":5' /tmp/bastionfall-island.html; then
            echo "F2.01 real WebGL2 terrain preview failed"
            tail -c 5500 /tmp/bastionfall-island.html
            tail -c 1800 /tmp/bastionfall-island.log
            exit 1
          fi
          grep -o '<pre id="trace">[^<]*' /tmp/bastionfall-island.html | head -1
          "$browser" --headless=new --no-sandbox --disable-dev-shm-usage \
            --use-angle=swiftshader --enable-unsafe-swiftshader --enable-webgl \
            --window-size=1280,960 --virtual-time-budget=6500 \
            --screenshot=/tmp/bastionfall-terrain-preview.png \
            'http://127.0.0.1:4173/tests/terrain-preview.html' \
            >/tmp/bastionfall-terrain-capture.log 2>&1
          test -s /tmp/bastionfall-terrain-preview.png
          echo "PASS: F2.05 258 seeded scenery instances, only five mesh draws, existing river/road/pads in WebGL2"
          # Dispatch a real pixel-space click in the running browser fixture:
          # an unlocked P01 must select; locked P09 must refuse selection.
          for probe in P01 P09; do
            "$browser" --headless=new --no-sandbox --disable-dev-shm-usage \
              --use-angle=swiftshader --enable-unsafe-swiftshader --enable-webgl \
              --window-size=1280,960 --virtual-time-budget=6500 \
              --dump-dom "http://127.0.0.1:4173/tests/terrain-preview.html?probePadClick=$probe" \
              >"/tmp/bastionfall-pad-click-$probe.html" 2>"/tmp/bastionfall-pad-click-$probe.log"
            if ! grep -q 'data-result="pass"' "/tmp/bastionfall-pad-click-$probe.html" \
              || ! grep -q 'data-pad-click-probe="pass"' "/tmp/bastionfall-pad-click-$probe.html"; then
              echo "F2.03 interactive pad selection failed for $probe"
              tail -c 5000 "/tmp/bastionfall-pad-click-$probe.html"
              tail -c 1000 "/tmp/bastionfall-pad-click-$probe.log"
              exit 1
            fi
          done
          echo "PASS: real canvas click selects unlocked pad and rejects locked pad"
      - name: Upload F1.06 gallery screenshot for human art review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-06-art-gallery-screenshot
          path: /tmp/bastionfall-gallery-landscape.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload F2.05 deterministic scenery and map screenshot for art inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f2-05-seeded-scenery-screenshot
          path: /tmp/bastionfall-terrain-preview.png
          if-no-files-found: warn
          retention-days: 14
